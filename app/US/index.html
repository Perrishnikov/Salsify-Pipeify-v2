<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../bootstrap.css" />
        <link rel="stylesheet" href="../override.css" />
        <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
        <title>Salsify: Pipeify v3 US</title>
    </head>
    <body data-country-code="US">
        <div class="container mt-4">
            <h1 class="text-center mb-4" id="page-title">
                Salsify: Pipeify v3 US
            </h1>
            <ul class="nav nav-tabs mb-3 nav-fill fs-5" role="tablist">
                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link active"
                        type="button"
                        role="tab"
                        aria-selected="true"
                    >
                        Create / Edit Set
                    </button>
                </li>
            </ul>
        </div>

        <div class="container mt-4" id="create-edit-set">
            <div id="import-drop-area" class="drop-area">
                <h5 class="mb-4" data-drop-label>
                    Drag and drop a file here or click to select
                </h5>
                <div id="import-file-name" class="ms-4 small"></div>
                <input type="file" id="file-input" style="display: none" />
            </div>

            <div
                class="button-box-row mt-4"
                style="display: flex; justify-content: space-between"
            >
                <div id="grow">
                    <button
                        type="button"
                        id="download-set-btn"
                        class="btn btn-primary me-2"
                    >
                        Download Set
                    </button>
                    <button id="clear-set-btn" class="btn btn-secondary">
                        Clear Set
                    </button>
                </div>
                <div class="">
                    <button type="button" class="btn btn-info" id="help-btn">
                        Help
                    </button>
                </div>
            </div>

            <div class="mt-3" id="download-options" style="display: none">
                <h5 class="mb-2">Download Options</h5>
                <div class="form-check mb-2">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="productIdOption"
                        id="product-id-new"
                        value="new"
                        data-product-id-option
                    />
                    <label class="form-check-label" for="product-id-new">
                        New Product ID
                    </label>
                </div>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="productIdOption"
                        id="product-id-keep"
                        value="keep"
                        checked
                        data-product-id-option
                    />
                    <label class="form-check-label" for="product-id-keep">
                        Keep current ID
                    </label>
                </div>
            </div>
        </div>

        <div class="container mt-4">
            <div class="mt-4" id="page-errors">
                <!-- v3 error section -->
            </div>

            <div class="table-wrapper mt-4 mb-4" id="tables-container">
                <!-- v3 tables render here -->
            </div>

            <div class="mt-4" id="live-preview">
                <!-- v3 live preview -->
            </div>
        </div>

        <script type="module" src="../scripts/v3/page.js"></script>
    </body>
</html>
